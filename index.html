<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aristotle Henderson</title>
<meta name="description" content="Aristotle Henderson, software engineer on the Roblox engine's Data Model team. A globe of the places I've studied and worked.">
<link rel="icon" href="/assets/images/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon-16x16.png">
<link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png">
<link rel="manifest" href="/assets/images/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<link rel="stylesheet" href="css/site.css">
</head>
<body>

<canvas id="globe" aria-hidden="true"></canvas>
<pre id="ascii-globe" aria-hidden="true"></pre>
<div id="scroll-zone" aria-hidden="true"></div>
<div class="ascii-probes" aria-hidden="true"><span id="ascii-probe-globe">MMMMMMMMMM</span><span id="ascii-probe-card">MMMMMMMMMM</span></div>
<div id="labels" aria-hidden="true"></div>

<div class="modebar" role="group" aria-label="View">
  <button type="button" data-mode="3d" aria-pressed="true">3D</button><button type="button" data-mode="ascii" aria-pressed="false">ASCII</button><button type="button" data-mode="html" aria-pressed="false">HTML</button>
</div>
<nav class="topbar" id="topbar" aria-label="Profiles"></nav>
<div class="problems" id="data-problems" role="alert" hidden></div>

<div id="plain" hidden></div>
<main id="stops">
  <section class="stop intro" id="intro"></section>
  <!-- One section per stop is added from the site data. -->
</main>

<div class="hud" role="group" aria-label="Stops">
  <button id="prev" type="button" aria-label="Previous stop">↑</button>
  <div class="hud-mid" id="hud-top" role="button" tabindex="0" title="Back to top" aria-live="polite">
    <span class="count" id="hud-count">00 / 00</span>
    <span class="name" id="hud-name"></span>
    <span class="xy" id="hud-xy"></span>
  </div>
  <button id="next" type="button" aria-label="Next stop">↓</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
