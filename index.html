  --g-ocean:#AFC4CC; --g-ocean2:#A0B8C2; --g-core:#7F97A2;

:root[data-theme="dark"]{

  --bg:#0C141A; --ink:#E3E9E6; --muted:#8FA0A6; --line:#26373F;
  --surface:rgba(15,25,32,.94); --surface-solid:#111C23;
  --accent:#F2B535; --accent-ink:#0C141A;
  --g-ocean:#173241; --g-ocean2:#1C3B4B; --g-core:#08141B;
  --g-land:#4C6D54; --g-land2:#64794D; --g-snow:#C4CFCD;
  --g-pin:#E3E9E6; --g-trail:#F2B535; --g-atmo:#3E86AD;
  --a-ocean:#4C7F9C; --a-land:#9BDA82; --a-high:#EDCF86; --a-ice:#E2ECEE;
}

html{scroll-behavior:auto}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}

#globe{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;display:block;pointer-events:none;z-index:0}
#labels{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.label{position:absolute;left:0;top:0;transform:translate(-50%,-100%);font:500 12px/1 var(--mono);letter-spacing:.02em;
  background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .25s}
.label.on{opacity:1}
.label.dim{background:var(--surface-solid);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.label.dim::after{background:var(--surface-solid)}
.label::after{content:"";position:absolute;left:50%;bottom:-5px;width:8px;height:8px;background:var(--ink);transform:translateX(-50%) rotate(45deg)}

.topbar{position:fixed;top:0;right:0;z-index:3;display:flex;gap:4px;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 0 0}
.topbar a{font:500 13px/1 var(--mono);color:var(--ink);text-decoration:none;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.topbar a:hover{border-color:var(--ink)}

main{position:relative;z-index:2;padding-inline:16px;pointer-events:none}
.card{pointer-events:auto}
/* On the overview, a touch on the globe pans it in any direction; only the name card scrolls the page. */
.can-drag #globe{pointer-events:auto;cursor:grab;touch-action:none}
.can-drag.dragging #globe{cursor:grabbing}
/* Below the name card on the overview, touches and the wheel scroll the page instead of moving the globe. */
#scroll-zone{position:fixed;left:0;right:0;bottom:0;z-index:1;display:none}
/* Controls, pin labels and drawing aren't content: a drag or long-press shouldn't highlight them or copy them.
   In the ASCII boxes, borders, padding, markers and banner art are marked .a-deco so a copy gets only the text. */
.modebar,.topbar,.hud,.links,#labels,#globe,#scroll-zone,.a-deco,.a-mk{-webkit-user-select:none;user-select:none}
.a-plain{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
#globe,#ascii-globe,#scroll-zone,.hud,.modebar,.topbar,.links{-webkit-touch-callout:none}
.stop{min-height:100vh;display:flex;align-items:center;padding-block:10vh}
.stop.side-right{justify-content:flex-end}
.stop.intro{min-height:92vh}

.card{width:min(390px,100%);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;
  display:flex;flex-direction:column;gap:10px;
  transition:border-color .3s, transform .5s}
.stop.active .card{border-color:var(--ink)}
@media (min-width:1100px){.stop .card{margin-inline:clamp(0px,4vw,80px)}}

.eyebrow{margin:0;font:500 12px/1.4 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.mark{flex:none;width:10px;height:10px;background:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-ink)}
.mark.diamond{background:var(--ink);transform:rotate(45deg);box-shadow:none;width:9px;height:9px}
h1,h2{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(2rem,5.4vw,3.6rem);line-height:1.05}
h2{font-size:1.45rem;line-height:1.2}
.role{margin:-4px 0 0;font-weight:600}
.projects{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.projects>li{display:flex;flex-direction:column;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
.projects>li:first-child{padding-top:0;border-top:0}
.proj-link{display:flex;justify-content:space-between;align-items:baseline;gap:12px;color:var(--ink);text-decoration:none}
.proj-title{font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.proj-link:hover .proj-title{text-decoration-thickness:2px}
.proj-date{flex:none;font:500 12px/1 var(--mono);color:var(--muted)}
.stop-projects{margin:0;font-size:.95rem}
.stop-projects a{color:var(--ink);text-underline-offset:3px}
.body{margin:0;color:var(--ink)}
.lede{margin:0;font-size:1.06rem}
.tags{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.tags li{font:500 12px/1 var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:999px}
.coords{margin:6px 0 0;padding-top:10px;border-top:1px solid var(--line);
  font:400 12px/1.4 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:4px 0 0;padding:0;list-style:none;font:400 13px/1.3 var(--mono);color:var(--muted)}
.legend li{display:flex;align-items:center;gap:8px}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{font:500 13px/1 var(--mono);color:var(--ink);padding:9px 11px;border:1px solid var(--ink);border-radius:999px;text-decoration:none}
.links a:hover{background:var(--ink);color:var(--bg)}
.hint{font:400 12px/1.4 var(--mono);color:var(--muted);margin:4px 0 0}

.photo{margin:0;display:flex;flex-direction:column;gap:8px}
.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px}
.photo-slot{aspect-ratio:4/3;max-width:100%;border:1px dashed var(--muted);border-radius:10px;display:grid;place-items:center;text-align:center;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:24px 24px;
  font:500 12px/1.5 var(--mono);color:var(--muted);padding:16px}
.photo-slot span{background:var(--surface-solid);padding:6px 8px}


.hud{position:fixed;z-index:3;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);
  display:flex;align-items:stretch;background:var(--ink);color:var(--bg);border-radius:999px;font:500 12px/1 var(--mono);overflow:hidden;max-width:calc(100vw - 32px)}
.hud button{all:unset;cursor:pointer;min-width:48px;min-height:44px;display:grid;place-items:center;font-size:17px;-webkit-tap-highlight-color:transparent}
.hud button:active{background:rgba(127,127,127,.35)}
.hud button:hover{background:rgba(127,127,127,.25)}
.hud button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hud-mid{display:flex;align-items:center;gap:12px;padding:8px 6px;min-width:0;line-height:1.5;font-variant-numeric:tabular-nums}
.hud-mid{cursor:pointer}
.hud-mid:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.hud-mid{flex:1;justify-content:center}
.hud-mid .count{color:var(--accent);white-space:nowrap}
.hud-mid .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud-mid .xy{opacity:.7;white-space:nowrap;flex:none}

.fallback{display:none}

/* View switch, top left. */
.modebar{position:fixed;z-index:4;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;display:flex;padding:3px;gap:2px;
  background:var(--surface);border:1px solid var(--line);border-radius:999px}
.modebar button{all:unset;cursor:pointer;font:500 12px/1 var(--mono);letter-spacing:.04em;padding:8px 12px;border-radius:999px;color:var(--muted);
  min-height:18px;-webkit-tap-highlight-color:transparent}
.modebar button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.modebar button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* HTML mode: a basic document. Browser defaults (system colors, default serif, native buttons), nothing else. */
#plain{max-width:42em;margin:0 auto;padding:8px 16px 48px;font:initial;color:CanvasText}
#plain *{all:revert}
[data-mode="html"] body{background:Canvas;color:CanvasText;font:initial}
[data-mode="html"] #globe,[data-mode="html"] #ascii-globe,[data-mode="html"] #labels,[data-mode="html"] #stops,
[data-mode="html"] .hud,[data-mode="html"] .topbar{display:none}
[data-mode="html"] .modebar{all:revert;display:block;max-width:42em;margin:0 auto;padding:12px 16px 0}
[data-mode="html"] .modebar button{all:revert;margin-right:4px}
[data-mode="html"] .modebar button[aria-pressed="true"]{font-weight:bold}

/* ASCII mode: text only. The canvas and HTML cards give way to the text globe and boxes. */
#ascii-globe{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;margin:0;z-index:0;overflow:hidden;display:none;
  font:400 clamp(10.5px, 1.05vw, 13px)/1 var(--mono);color:var(--muted);pointer-events:none;user-select:none;-webkit-user-select:none}
#ascii-globe.can-drag{pointer-events:auto;cursor:grab;touch-action:none}
.ascii-probes{position:absolute;visibility:hidden;pointer-events:none;left:-9999px;top:0}
#ascii-probe-globe{font:400 clamp(10.5px, 1.05vw, 13px)/1 var(--mono);white-space:pre}
#ascii-probe-card,.abox{font:400 12.5px/1.45 var(--mono)}
#ascii-probe-card{white-space:pre}
.abox{display:none;margin:0;white-space:pre;color:var(--ink);background:var(--bg);pointer-events:auto;max-width:100%;overflow:hidden}
.abox .ln{display:block;white-space:pre}
.abox .ln.tight{line-height:1.08}
.abox a{color:var(--ink);text-decoration:underline;text-underline-offset:2px}
.abox a:hover{background:var(--ink);color:var(--bg);text-decoration:none}
/* Only weights the page actually loads (400, 500): a synthesized bold is wider and breaks the columns. */
.a-dim{color:var(--muted)} .a-ink{color:var(--ink);font-weight:500}
/* Land is dense and heavy; ocean, atmosphere and stars stay faint so the continents stand off the page. */
.a-o{color:var(--a-ocean);opacity:.7} .a-rim{color:var(--a-ocean);font-weight:500} .a-l{color:var(--a-land);font-weight:500} .a-h{color:var(--a-high);font-weight:500} .a-i{color:var(--a-ice);font-weight:500}
.a-atm{color:var(--a-ocean);opacity:.45} .a-star{color:var(--muted);opacity:.45} .a-rt{color:var(--accent)}
.a-mk{color:var(--accent);font-weight:500} .a-lb{color:var(--ink)} .a-lbo{background:var(--ink);color:var(--bg);font-weight:500}
[data-mode="ascii"] #globe,[data-mode="ascii"] #labels,[data-mode="ascii"] .card{display:none}
[data-mode="ascii"] #ascii-globe{display:block}
[data-mode="ascii"] .abox{display:block}
[data-mode="ascii"] .stop.active .abox{color:var(--ink)}
[data-mode="ascii"] .hud,[data-mode="ascii"] .modebar,[data-mode="ascii"] .modebar button,[data-mode="ascii"] .topbar a{border-radius:0}
[data-mode="ascii"] .topbar a::before{content:"["} [data-mode="ascii"] .topbar a::after{content:"]"}
[data-mode="ascii"] .topbar a{background:var(--bg)}
[data-mode="ascii"] .hud{background:var(--bg);color:var(--ink);border:1px solid var(--ink)}
[data-mode="ascii"] .hud-mid .count{color:var(--ink)}
.problems{position:fixed;z-index:4;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 64px);max-width:640px;margin-inline:auto;
  background:var(--surface-solid);color:var(--ink);border:1px solid var(--ink);border-radius:12px;padding:12px 16px;font:400 13px/1.5 var(--mono)}
.problems ul{margin:6px 0 0;padding-left:18px}
.no-webgl .fallback{display:block}

@media (max-width:1099px){
  .stop, .stop.side-right{justify-content:flex-start}
}
@media (max-width:699px){
  .topbar{display:none}
  .stop{align-items:flex-end;min-height:108vh;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 76px)}
  .stop.intro{min-height:100vh}
  .card{width:100%;background:var(--surface)}
  .hud{bottom:calc(env(safe-area-inset-bottom,0px) + 12px);left:16px;right:16px;transform:none;max-width:none}
  .hud-mid{flex:1;justify-content:center}
  .hud-mid{gap:10px}
}
@media (prefers-reduced-motion: reduce){
  .label,.card{transition:none}
}
</style>

    encoding: { const: "uint8-deflate-base64" },   // one byte per cell, zlib-compressed; 0 = sea level or below

const SITE_SCHEMA = {

          properties: {

            closeTiltDeg: { type: "number", minimum: 0, maximum: 60 },
            dragSpeed: { type: "number", minimum: 0.05, maximum: 3 },   // 1 = surface follows the pointer

            overviewZoom: {

function validate(value, schema, path = "site", errors = []) {
  const at = msg => errors.push(`${path}: ${msg}`);
  const kind = Array.isArray(value) ? "array" : value === null ? "null" : typeof value;
  if (schema.type) {
    const types = [].concat(schema.type);
    const ok = types.some(t => t === "integer" ? Number.isInteger(value) : t === kind);
    if (!ok) { at(`expected ${types.join(" or ")}, got ${kind}`); return errors; }
  }
  if ("const" in schema && value !== schema.const) at(`must be ${JSON.stringify(schema.const)}`);
  if (schema.enum && !schema.enum.includes(value)) at(`must be one of ${schema.enum.join(", ")}`);
  if (kind === "string") {
    if (schema.minLength && value.length < schema.minLength) at("must not be empty");
    if (schema.pattern && !new RegExp(schema.pattern).test(value)) at(`does not match ${schema.pattern}`);
  }
  if (kind === "number") {
    if ("minimum" in schema && value < schema.minimum) at(`must be at least ${schema.minimum}`);
    if ("maximum" in schema && value > schema.maximum) at(`must be at most ${schema.maximum}`);
  }
  if (kind === "array") {
    if (schema.minItems && value.length < schema.minItems) at(`needs at least ${schema.minItems} item(s)`);
    if (schema.items) value.forEach((v, i) => validate(v, schema.items, `${path}[${i}]`, errors));
  }
  if (kind === "object") {
    const props = schema.properties || {};
    for (const key of schema.required || []) if (!(key in value)) at(`missing "${key}"`);
    if (schema.minProperties && Object.keys(value).length < schema.minProperties) at("must not be empty");
    for (const [key, v] of Object.entries(value)) {
      if (props[key]) validate(v, props[key], `${path}.${key}`, errors);
      else if (schema.additionalProperties === false) at(`unknown field "${key}"`);
      else if (typeof schema.additionalProperties === "object") validate(v, schema.additionalProperties, `${path}.${key}`, errors);
    }
  }
  return errors;
}

// Land masks: each row is a run of water cells, then land, then water... as base64 varints.
function decodeMask(b64, w, h) {
  const out = new Uint8Array(w * h);
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  let k = 0;
  const read = () => {
    let n = 0, sh = 0, b;
    do { if (k >= bytes.length) throw new Error("mask ends early"); b = bytes[k++]; n |= (b & 127) << sh; sh += 7; } while (b & 128);
    return n;
  };
  for (let r = 0; r < h; r++) {
    let c = 0, v = 0;
    while (c < w) {
      const n = read();
      if (c + n > w) throw new Error(`row ${r} is longer than ${w} cells`);
      if (v) out.fill(1, r * w + c, r * w + c + n);
      c += n; v ^= 1;
    }
  }
  if (k !== bytes.length) throw new Error("mask has extra data");
  return out;
}

// Structural errors stop the page; problems local to one stop or region drop only that item.
function checkSite(raw) {
  // Stops, projects and regions are checked one at a time below, so one bad item doesn't block the page.
  const P = SITE_SCHEMA.properties;
  const outer = { ...SITE_SCHEMA, properties: { ...P, stops: { ...P.stops, items: { type: "object" } },
    detailRegions: { ...P.detailRegions, items: { type: "object" } },
    projects: { ...P.projects, items: { type: "object" } } } };
  const errors = validate(raw, outer);
  if (errors.length) return { errors, site: null };
  const site = structuredClone(raw);
  const itemOk = (list, schema, name) => list.filter((item, i) => {
    const e = validate(item, schema, `site.${name}[${i}]${item.id ? ` (${item.id})` : ""}`);
    errors.push(...e);
    return !e.length;
  });
  const drop = [];
  const views = site.views, kinds = site.kinds, markers = site.markers;
  for (const [name, k] of Object.entries(kinds))
    if (!markers[k.marker]) errors.push(`site.kinds.${name}: unknown marker "${k.marker}"`);
  if (!views[site.overview.view]) errors.push(`site.overview: unknown view "${site.overview.view}"`);
  const gl = site.globe.layers;
  if (gl.land.columns !== 2 * gl.land.rows) errors.push("site.globe.layers.land: needs twice as many columns as rows");
  if (gl.elevation.columns !== 2 * gl.elevation.rows) errors.push("site.globe.layers.elevation: needs twice as many columns as rows");
  const ice = site.globe.terrain.iceLatitude;
  if (ice.south >= ice.north) errors.push("site.globe.terrain.iceLatitude: south must be below north");
  try { site.globe.mask = decodeMask(gl.land.data, gl.land.columns, gl.land.rows); }
  catch (e) { errors.push(`site.globe.layers.land: ${e.message}`); }
  if (errors.length) return { errors, site: null };

  // From here on, a problem drops only the stop or region it is in.
  site.stops = itemOk(site.stops, P.stops.items, "stops");
  site.detailRegions = itemOk(site.detailRegions || [], P.detailRegions.items, "detailRegions");
  const ids = new Set();
  site.stops = site.stops.filter((s, i) => {
    const p = `site.stops (${s.id})`, before = errors.length;
    if (ids.has(s.id)) errors.push(`${p}: duplicate id`);
    ids.add(s.id);
    const kind = kinds[s.kind];
    if (!kind) errors.push(`${p}: unknown kind "${s.kind}"`);
    if (!views[s.view]) errors.push(`${p}: unknown view "${s.view}"`);
    if (kind && kind.card === "entry") {
      for (const f of ["start", "body"]) if (!(f in s)) errors.push(`${p}: an entry card needs "${f}"`);
      if (s.start && s.end && s.end !== "present" && s.end < s.start) errors.push(`${p}: ends before it starts`);
    }
    if (kind && kind.card === "photo" && !s.photo) errors.push(`${p}: a photo card needs "photo"`);
    if (kind && kind.card === "photo" && s.photo && !s.photo.src && !s.photo.placeholder)
      errors.push(`${p}: a photo needs "src", or "placeholder": true`);
    if (errors.length > before) { drop.push(s.id); return false; }
    return true;
  });
  // Layout: each section at most once, and experience always (every stop needs a card).
  const layout = site.layout || [{ section: "projects" }, { section: "experience" }];
  for (const sec of ["projects", "experience"]) {
    const n = layout.filter(b => b.section === sec).length;
    if (n > 1) errors.push(`site.layout: "${sec}" is listed ${n} times`);
  }
  site.layout = layout.filter((b, i) => layout.findIndex(o => o.section === b.section) === i);
  if (!site.layout.some(b => b.section === "experience")) {
    errors.push(`site.layout: needs an "experience" section`);
    site.layout.push({ section: "experience" });
  }
  for (const s of site.stops) if (s.id === "intro" || s.id === "projects") errors.push(`site.stops (${s.id}): "${s.id}" is reserved`);
  site.stops = site.stops.filter(s => s.id !== "intro" && s.id !== "projects");
  site.projects = itemOk(site.projects || [], P.projects.items, "projects");
  const pids = new Set(), stopIds = new Set(site.stops.map(s => s.id));
  site.projects = site.projects.filter(pr => {
    const p = `site.projects (${pr.id})`, before = errors.length;
    if (pids.has(pr.id)) errors.push(`${p}: duplicate id`);
    pids.add(pr.id);
    if (pr.stop && !stopIds.has(pr.stop)) errors.push(`${p}: unknown stop "${pr.stop}"`);
    return errors.length === before;
  });
  site.detailRegions = (site.detailRegions || []).filter((g, i) => {
    const p = `site.detailRegions (${g.id})`, b = g.bounds;
    if (b.south >= b.north || b.west >= b.east) { errors.push(`${p}: bounds are inverted`); return false; }
    const cellW = (b.east - b.west) / g.land.columns, cellH = (b.north - b.south) / g.land.rows;
    if (Math.abs(cellW - cellH) > 1e-9) {
      errors.push(`${p}.land: cells are ${cellW}° wide but ${cellH}° tall; they must be square`); return false;
    }
    g.cellDeg = cellW;
    try { g.mask = decodeMask(g.land.data, g.land.columns, g.land.rows); }
    catch (e) { errors.push(`${p}.land: ${e.message}`); return false; }
    return true;
  });
  if (!site.stops.length) { errors.push("site.stops: no valid stops left"); return { errors, site: null }; }
  return { errors, site, dropped: drop };
}

// ---------- Load ----------
const EARTH_KM = 6371;
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const fmtLat = v => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? "N" : "S"}`;
const fmtLon = v => `${Math.abs(v).toFixed(4)}° ${v >= 0 ? "E" : "W"}`;
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtMonth = m => m === "present" ? "present" : `${MONTHS[+m.slice(5, 7) - 1]} ${m.slice(0, 4)}`;

const PROBLEMS = [];
function showProblems(errors, fatal) {
  if (!errors.length) return;
  console.warn("Site data problems:\n" + errors.join("\n"));
  PROBLEMS.push(...errors);
  const box = document.getElementById("data-problems");
  box.hidden = false;
  box.innerHTML = `<strong>${fatal ? "The site data can't be shown." : "Some site data was skipped."}</strong>
    <ul>${PROBLEMS.map(e => `<li>${esc(e)}</li>`).join("")}</ul>`;
}

// Elevation layers are zlib-compressed bytes. The browser inflates them; a bad layer reads as sea level.
async function loadElevation(layer, path) {
  try {
    if (!window.DecompressionStream) throw new Error("this browser can't decompress it");
    const bytes = Uint8Array.from(atob(layer.data), c => c.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate"));
    const out = new Uint8Array(await new Response(stream).arrayBuffer());
    if (out.length !== layer.columns * layer.rows)
      throw new Error(`has ${out.length} cells, expected ${layer.columns} x ${layer.rows}`);
    return out;
  } catch (e) {
    showProblems([`${path}: ${e.message}. Terrain there is drawn flat.`], false);
    return new Uint8Array(layer.columns * layer.rows);
  }
}

let raw;
try { raw = JSON.parse(document.getElementById("site-data").textContent); }
catch (e) { raw = null; showProblems([`site-data is not valid JSON: ${e.message}`], true); }
const checked = raw ? checkSite(raw) : { errors: [], site: null };
if (raw) showProblems(checked.errors, !checked.site);
const SITE = checked.site;
if (!SITE) throw new Error("site data invalid");

const altitude = view => SITE.views[view].altitudeKm / EARTH_KM;
const dateOf = s => s.start || s.date || (s.photo && s.photo.taken) || null;
function ordered(stops, order) {
  if (!order || order === "as-listed") return stops;
  const dated = stops.filter(dateOf), undated = stops.filter(s => !dateOf(s));
  // Stable sort by YYYY-MM (string order is date order); ties keep their listed order.
  dated.sort((a, b) => order === "newest-first" ? dateOf(b).localeCompare(dateOf(a)) : dateOf(a).localeCompare(dateOf(b)));
  return [...dated, ...undated];
}
const STOPS = ordered(SITE.stops, SITE.order).map(s => ({ ...s, dist: 1 + altitude(s.view) }));
const KINDS = SITE.kinds, MARKERS = SITE.markers;
const shapeOf = s => MARKERS[KINDS[s.kind].marker].shape;
const INTRO = { id: "intro", lat: SITE.overview.lat, lon: SITE.overview.lon,
  dist: 1 + altitude(SITE.overview.view), name: "Overview" };

// The page after the intro, in `layout` order. The projects card is one step; the globe pulls back to the
// overview framing while it's on screen.
const PROJECTS = ordered(SITE.projects, SITE.order);
let PROJECTS_STEP = null;
const SEQ = [];
for (const b of SITE.layout) {
  let items;
  if (b.section === "projects") {
    if (!PROJECTS.length) continue;
    PROJECTS_STEP = { id: "projects", title: b.label || "Projects",
      lat: INTRO.lat, lon: INTRO.lon, dist: INTRO.dist };
    items = [PROJECTS_STEP];
  } else items = STOPS;
  SEQ.push(...items);
}
const projectsAt = s => PROJECTS.filter(pr => pr.stop === s.id);
// Elevation layers, decoded once and shared by the 3D globe and the ASCII globe.
const TERRAIN = (async () => {
  const out = { globe: await loadElevation(SITE.globe.layers.elevation, "site.globe.layers.elevation"), regions: {} };
  for (const g of SITE.detailRegions) if (g.elevation)
    out.regions[g.id] = await loadElevation(g.elevation, `site.detailRegions (${g.id}).elevation`);
  return out;
})();
const REGIONS = SITE.detailRegions.map(g => ({
  id: g.id, name: g.name, lat0: g.bounds.south, lat1: g.bounds.north, lon0: g.bounds.west, lon1: g.bounds.east,
  step: g.cellDeg, w: g.land.columns, h: g.land.rows, mask: g.mask, elevationLayer: g.elevation,
}));

// ---------- View mode: "3d" (WebGL globe), "ascii" (text only) or "html" (a basic document). #ascii / #html open those. ----------
let MODE = (() => {
  const known = ["3d", "ascii", "html"];
  if (known.includes(location.hash.slice(1))) return location.hash.slice(1);
  try { const v = localStorage.getItem("site-mode"); if (known.includes(v)) return v; } catch (e) {}
  return "3d";
})();

// ---------- Render ----------
const P = SITE.profile;
document.title = P.name;
const linksHtml = (P.links || []).map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
document.getElementById("topbar").innerHTML = linksHtml;
const markHtml = shape => `<span class="mark${shape === "diamond" ? " diamond" : ""}"></span>`;
const legend = [...new Set(STOPS.map(s => KINDS[s.kind].marker))]
  .map(m => `<li>${markHtml(MARKERS[m].shape)}${esc(MARKERS[m].legend)}</li>`).join("");
document.getElementById("intro").innerHTML = `<article class="card">
  <p class="eyebrow">${markHtml("cube")}${esc(P.headline)} · ${esc(P.location)}</p>
  <h1>${esc(P.name)}</h1>
  <p class="lede">${esc(P.intro)}</p>
  <ul class="legend">${legend}</ul>
  ${linksHtml ? `<div class="links">${linksHtml}</div>` : ""}
  <p class="fallback hint">This browser can't draw the 3D globe, so the places are listed as text below.</p>
</article><pre class="abox"></pre>`;

function eyebrowOf(s) {
  if (KINDS[s.kind].card === "photo") {
    if (s.photo.placeholder) return "Example photo stop";
    return s.photo.taken ? `Photo · ${fmtMonth(s.photo.taken)}` : "Photo";
  }
  const dates = s.end ? `${fmtMonth(s.start)} – ${fmtMonth(s.end)}` : fmtMonth(s.start);
  return [dates, s.employment, s.workplace].filter(Boolean).join(" · ");
}
const tagsHtml = tags => tags && tags.length ? `<ul class="tags">${tags.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : "";
function projectsCard(step) {
  const list = PROJECTS.map(pr => `<li>
  <a class="proj-link" href="${esc(pr.path)}"><span class="proj-title">${esc(pr.title)}</span>${pr.date ? `<span class="proj-date">${esc(fmtMonth(pr.date))}</span>` : ""}</a>

// keyed by their exact integer weights on the icosahedron's corners, so a point on an edge shared by two faces is

    requestAnimationFrame(frame);
  };

}

    const offX = layout === "mid" ? 0.4 : 0, offY = layout === "narrow" ? 0.4 : 0;

    const key = C[0] * 1.3 + C[1] * 1.7 + C[2] * 2.9 + F[0] * 3.1 + F[1] * 3.7 + cols * 7 + rows * 11 + (E ? 1 : 0);
    if (key === lastKey && !needs) { requestAnimationFrame(frame); return; }
    // The idle spin moves the globe less than a character a frame, so it redraws at 30 fps; drags, zooms and
    // flights still redraw every frame.
    const idleSpin = overview && !drag.on && !pz.pinching && now - drag.lastMove > 2500 && Math.abs(tLog - cur.logAlt) < 1e-3;
    if (idleSpin && !needs && now - lastDraw < 30) { requestAnimationFrame(frame); return; }
    lastDraw = now;
    lastKey = key; needs = false;

    // Light in camera space: key from the upper left, like the 3D globe.
    const Ldir = norm(R.map((v, i) => v * -1.4 + U[i] * 1.1 - F[i] * 0.55));
    const light = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    const onLight = parseInt(light.slice(1, 3), 16) > 128;
    const cellDeg = (alt * tanH * 2 / rows) / D;   // roughly how many degrees one character covers
    const glyph = new Array(cols * rows), cls = new Uint8Array(cols * rows);   // 0 none 1 ocean 2 land 3 high 4 ice 5 atmo 6 star 7 route 8 marker 9 label 10 active label
    const cc = dot(C, C) - 1;
    // Which cells hit the sphere, and the screen direction of the surface normal there, for the outline.
    const hit = new Uint8Array(cols * rows), sx = new Float32Array(cols * rows), sy = new Float32Array(cols * rows);
    for (let j = 0; j < rows; j++) {
      const py = 1 - (j + 0.5) / rows * 2 - offY;
      for (let i = 0; i < cols; i++) {
        const px = (i + 0.5) / cols * 2 - 1 - offX, n = j * cols + i;
        const rx = F[0] + (R[0] * px * aspectPx + U[0] * py) * tanH;
        const ry = F[1] + (R[1] * px * aspectPx + U[1] * py) * tanH;
        const rz = F[2] + (R[2] * px * aspectPx + U[2] * py) * tanH;
        const rl = Math.hypot(rx, ry, rz), dx = rx / rl, dy = ry / rl, dz = rz / rl;
        const b = C[0] * dx + C[1] * dy + C[2] * dz, disc = b * b - cc;
        if (disc < 0) {
          // Missed the globe: a sparse starfield. Stars never use ".", which is the ocean's glyph.
          if (hash(i * 3.1, j * 7.7) < 0.006) { glyph[n] = hash(i, j * 2) < 0.3 ? "*" : "+"; cls[n] = 6; }
          else glyph[n] = " ";
          continue;
        }
        const s = -b - Math.sqrt(disc);
        const x = C[0] + dx * s, y = C[1] + dy * s, z = C[2] + dz * s;
        hit[n] = 1; sx[n] = x * R[0] + y * R[1] + z * R[2]; sy[n] = x * U[0] + y * U[1] + z * U[2];
        const lat = Math.asin(Math.max(-1, Math.min(1, y))) / D, lon = Math.atan2(-z, x) / D;
        let nx = x, ny = y, nz = z;
        const land = landAt(lat, lon);
        if (!land) {
          // Ocean stays quiet so the land reads, but fills the disc: dots everywhere in the light, a checkerboard
          // in shadow, and a few waves where it's brightest.
          const lit = Math.max(0, nx * Ldir[0] + ny * Ldir[1] + nz * Ldir[2]);
          const lattice = (i + j) % 2 === 0, t = hash(i, j);
          glyph[n] = lit > 0.5 && t < 0.07 ? "~" : lit > 0.3 || lattice ? "." : " ";
          cls[n] = 1;
          continue;
        }
        // Hillshade: tilt the normal by the elevation slope across this cell.
        const d = Math.max(0.01, cellDeg), e0 = elevAt(lat, lon);
        // Forward differences, doubled to match the old central ones: three lookups a cell instead of five.
        const gE = (elevAt(lat, lon + d) - e0) * 2, gN = (elevAt(lat + d, lon) - e0) * 2;
        const exag = 12 / Math.max(0.02, d);
        const eLon = [-Math.sin(lon * D), 0, -Math.cos(lon * D)], nLat = [-Math.sin(lat * D) * Math.cos(lon * D), Math.cos(lat * D), Math.sin(lat * D) * Math.sin(lon * D)];
        nx -= (eLon[0] * gE + nLat[0] * gN) * exag * 0.001; ny -= (eLon[1] * gE + nLat[1] * gN) * exag * 0.001; nz -= (eLon[2] * gE + nLat[2] * gN) * exag * 0.001;
        const nl = Math.hypot(nx, ny, nz); nx /= nl; ny /= nl; nz /= nl;
        const lit = Math.max(0, nx * Ldir[0] + ny * Ldir[1] + nz * Ldir[2]);
        const bright = Math.min(1, 0.25 + lit * 0.85);
        const ice = lat > T.iceLatitude.north || lat < T.iceLatitude.south;
        if (ice) {
          const idx = Math.floor((onLight ? 1 - bright : bright) * (RAMP_ICE.length - 0.01));
          glyph[n] = RAMP_ICE[idx]; cls[n] = 4;
        } else if (e0 > 3.2 && lit > 0.3) { glyph[n] = "^"; cls[n] = 3; }
        else {
          const r = onLight ? 1 - bright : bright, jitter = (hash(i * 1.7, j * 2.3) - 0.5) * 0.28;
          glyph[n] = RAMP_LAND[Math.max(0, Math.min(RAMP_LAND.length - 1, Math.floor((r + jitter) * RAMP_LAND.length)))];
          cls[n] = e0 > 1.5 ? 3 : 2;
        }
      }
    }

    // Outline: sphere cells next to a cell that misses it get a line glyph that follows the edge.
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const n = j * cols + i;
      if (!hit[n]) continue;
      const a = Math.atan2(sy[n], sx[n]) / D;   // 0 is right, 90 is up, on screen
      const q = ((a % 180) + 180) % 180;
      // Steep edges only look sideways and flat edges only up and down, so the line stays one glyph thick.
      const hOut = (i > 0 && !hit[n - 1]) || (i < cols - 1 && !hit[n + 1]);
      const vOut = (j > 0 && !hit[n - cols]) || (j < rows - 1 && !hit[n + cols]);
      const steep = q < 30 || q >= 150, flat = q >= 70 && q < 110;
      if (!(steep ? hOut : flat ? vOut : hOut || vOut)) continue;
      glyph[n] = q < 22.5 || q >= 157.5 ? "|" : q < 67.5 ? "\\" : q < 112.5 ? "-" : "/";
      cls[n] = 11;
    }

    // World point -> cell. Hidden when on the far side of the globe.
    const toCell = p => {
      if (dot(p, C) <= 1) return null;
      const v = [p[0] - C[0], p[1] - C[1], p[2] - C[2]], zc = dot(v, F);
      if (zc <= 0) return null;
      const px = dot(v, R) / (zc * tanH * aspectPx) + offX, py = dot(v, U) / (zc * tanH) + offY;
      const ci = Math.floor((px + 1) / 2 * cols), cj = Math.floor((1 - py) / 2 * rows);
      return ci >= 0 && ci < cols && cj >= 0 && cj < rows ? [ci, cj] : null;
    };
    const put = (ci, cj, text, c, force) => {
      for (let q = 0; q < text.length; q++) {
        const i = ci + q; if (i < 0 || i >= cols) continue;
        const n = cj * cols + i;
        if (!force && cls[n] >= 7) return false;
      }
      for (let q = 0; q < text.length; q++) { const i = ci + q; if (i >= 0 && i < cols) { glyph[cj * cols + i] = text[q]; cls[cj * cols + i] = c; } }
      return true;
    };

    // Route: dotted great-circle arcs between school and work stops, hidden in close-ups.
    if (alt > 0.12) for (let r = 0; r + 1 < route.length; r++) {
      const A = fromLL(route[r].lat, route[r].lon), B = fromLL(route[r + 1].lat, route[r + 1].lon);
      const om = Math.acos(Math.max(-1, Math.min(1, dot(A, B)))), steps = Math.max(8, Math.ceil(om / D * 2));
      for (let k2 = 1; k2 < steps; k2++) {
        const t = k2 / steps, sa = Math.sin((1 - t) * om), sb = Math.sin(t * om), so = Math.sin(om) || 1;
        const lift = 1 + 0.03 + Math.sin(Math.PI * t) * Math.max(0.01, om * 0.35);
        const p = [0, 1, 2].map(q => (A[q] * sa + B[q] * sb) / so * lift);
        const cell = toCell(p);
        if (cell && k2 % 2 === 0) put(cell[0], cell[1], ".", 7);
      }
    }

    // Pins: grouped when they share a cell neighbourhood; the current stop stays on its own.
    const pins = [];
    for (const s of STOPS) {
      const cell = toCell(fromLL(s.lat, s.lon));
      if (cell) pins.push({ s, cell, on: s.id === stop.id });
    }
    const groups = [];
    for (const p of pins) {
      const g = !p.on && groups.find(g => !g.on && Math.abs(g.cell[0] - p.cell[0]) <= 3 && Math.abs(g.cell[1] - p.cell[1]) <= 1);
      if (g) g.members.push(p); else groups.push({ cell: p.cell, on: p.on, members: [p] });
    }
    const close = alt < 0.2;
    for (const g of groups) {
      const [ci, cj] = g.cell;
      if (g.members.length > 1) { put(ci - 1, cj, `(${g.members.length})`, 8, true); continue; }
      const p = g.members[0], m = MARK[shapeOf(p.s)];
      if (p.on) {
        put(ci - 1, cj, `[${m}]`, 8, true);
        const label = " " + toAscii(p.s.title).toUpperCase() + " ";
        if (!put(ci + 3, cj, label, 10) && !put(ci - 2 - label.length, cj, label, 10)) put(ci - Math.floor(label.length / 2), cj - 1, label, 10);
      } else {
        put(ci, cj, m, 8, true);
        if (close) { const label = " " + toAscii(p.s.title) + " "; put(ci + 2, cj, label, 9) || put(ci - 1 - label.length, cj, label, 9); }
      }
    }

    // Compose runs of the same class into spans. Each row is its own element and only rows whose markup changed
    // are replaced, so a slow spin restyles and repaints a few rows a frame instead of the whole screen.
    const CL = ["", "a-o", "a-l", "a-h", "a-i", "a-atm", "a-star", "a-rt", "a-mk", "a-lb", "a-lbo", "a-rim"];
    if (rowEls.length !== rows) {
      pre.textContent = "";
      rowEls = []; rowHtml = [];
      for (let j = 0; j < rows; j++) {
        const r = document.createElement("span");
        r.className = "a-row";
        pre.appendChild(r); rowEls.push(r); rowHtml.push("");
        if (j < rows - 1) pre.appendChild(document.createTextNode("\n"));
      }
    }
    for (let j = 0; j < rows; j++) {
      let html = "", run = "", rc = -1;
      for (let i = 0; i < cols; i++) {
        const n = j * cols + i, c = cls[n];
        if (c !== rc) { if (run) html += rc > 0 ? `<span class="${CL[rc]}">${escHtml(run)}</span>` : escHtml(run); run = ""; rc = c; }
        run += glyph[n];
      }
      if (run) html += rc > 0 ? `<span class="${CL[rc]}">${escHtml(run)}</span>` : escHtml(run);
      if (html !== rowHtml[j]) { rowEls[j].innerHTML = html; rowHtml[j] = html; }
    }
    requestAnimationFrame(frame);
  }
  window.__resumeAscii = () => {
    if (!sleeping) return;
    sleeping = false; last = null; needs = true; wasIntro = null;
    measureGrid();
    requestAnimationFrame(frame);
  };
  window.__asciiNeeds = () => { measureGrid(); needs = true; };
  new MutationObserver(() => { needs = true; }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { needs = true; });
}

// ---------- HTML mode: the same data as a plain document ----------
function renderPlain() {
  const el = document.getElementById("plain");
  const links = (P.links || []).map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join(" | ");
  const stopHtml = s => {
    const head = `<h3>${esc(s.title)}</h3>\n<p><em>${esc(eyebrowOf(s))}</em><br>${esc(s.place)}</p>`;
    const own = projectsAt(s);
    const proj = own.length ? `\n<p>Projects: ${own.map(pr => `<a href="${esc(pr.path)}">${esc(pr.title)}</a>`).join(", ")}</p>` : "";
    if (KINDS[s.kind].card === "photo") {
      const img = s.photo.src ? `<img src="${esc(s.photo.src)}" alt="${esc(s.photo.alt || s.photo.caption)}" width="480">` : "";
      return `<article id="plain-${s.id}">${head}\n<figure>${img}<figcaption>${esc(s.photo.caption)}</figcaption></figure>${proj}</article>`;
    }
    return `<article id="plain-${s.id}">${head}
${s.role ? `<p><strong>${esc(s.role)}</strong></p>` : ""}
<p>${esc(s.body)}</p>
${s.tags && s.tags.length ? `<p>${s.tags.map(esc).join(", ")}</p>` : ""}${proj}</article>`;
  };
  // Same sections, in the same order, as the globe views.
  const sections = SITE.layout.map(b => {
    if (b.section === "projects") {
      if (!PROJECTS_STEP) return "";
      const list = PROJECTS.map(pr => `<li><a href="${esc(pr.path)}">${esc(pr.title)}</a>${pr.date ? ` (${esc(fmtMonth(pr.date))})` : ""}: ${esc(pr.summary)}</li>`).join("\n");
      return `<h2>${esc(PROJECTS_STEP.title)}</h2>\n<ul>\n${list}\n</ul>`;
    }
    return `<h2>${esc(b.label || "Experience and education")}</h2>\n${STOPS.map(stopHtml).join("\n<hr>\n")}`;
  }).filter(Boolean).join("\n<hr>\n");
  el.innerHTML = `<header>
<h1>${esc(P.name)}</h1>
<p>${esc(P.headline)}, ${esc(P.location)}</p>
<p>${esc(P.intro)}</p>
${links ? `<p>${links}</p>` : ""}
</header>
<hr>
${sections}`;
}

// ---------- Mode switch ----------
let globeStarted = false, asciiStarted = false;
function setMode(m, save) {
  MODE = m;
  document.documentElement.dataset.mode = m;
  document.documentElement.classList.remove("can-drag");
  syncScrollZone();
  for (const b of document.querySelectorAll(".modebar button")) b.setAttribute("aria-pressed", String(b.dataset.mode === m));
  if (save) try { localStorage.setItem("site-mode", m); } catch (e) {}
  document.getElementById("plain").hidden = m !== "html";
  if (m === "html") {
    renderPlain();
  } else if (m === "3d") {
    if (!globeStarted) { globeStarted = true; globe(); } else window.__resume3D && window.__resume3D();
  } else {
    if (!asciiStarted) { asciiStarted = true; asciiGlobe(); }
    renderBoxes();
    window.__resumeAscii();
  }
  renderHud();
  sizeHud();
  requestAnimationFrame(() => { measure(); updateActive(); });
}
for (const b of document.querySelectorAll(".modebar button")) b.addEventListener("click", () => setMode(b.dataset.mode, true));
document.fonts?.ready.then(() => { if (asciiStarted) { renderBoxes(); window.__asciiNeeds(); } });
setMode(MODE, false);
</script>
</body>
</html>
